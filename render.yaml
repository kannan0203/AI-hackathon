services:
  - type: web
    name: bizinsight-ai-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # you set this in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
    rootDir: backend
